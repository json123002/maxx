# Turnover Screener 站点配置（作为 /etc/nginx/conf.d/turnover.conf 部署；
# 默认 server 段由 deploy.py 自动注释，避免 80 端口冲突）
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    root         /opt/turnover-screener/frontend;
    index        index.html;

    # JSON/JS/CSS 走 gzip（1M 带宽下必要）
    gzip on;
    gzip_proxied any;              # 经 vite 开发代理等转发来的请求也压缩
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1k;

    # 后端 API 反代（仅本机回环，对外不暴露 8000）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # 静态资源：vite 产物文件名带内容哈希，可安全长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立即生效（其引用的哈希资产已被长缓存）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
