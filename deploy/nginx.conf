# Turnover Screener 站点配置（作为 /etc/nginx/conf.d/turnover.conf 部署；
# 默认 server 段由 deploy.py 自动注释，避免 80 端口冲突）
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    root         /opt/turnover-screener/frontend;
    index        index.html;

    # JSON 走 gzip（1M 带宽下必要）
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1k;

    # 后端 API 反代（仅本机回环，对外不暴露 8000）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
